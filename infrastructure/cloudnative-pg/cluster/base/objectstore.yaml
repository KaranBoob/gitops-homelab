apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2
spec:
  retentionPolicy: 7d
  configuration:
    # local-test: MinIO in-cluster instead of R2. Real submission (main) uses R2.
    destinationPath: s3://postgres-backup/ENV/
    endpointURL: http://garage.object-store.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: r2-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: r2-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip

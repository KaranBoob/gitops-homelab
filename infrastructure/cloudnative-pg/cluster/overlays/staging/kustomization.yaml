apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: staging
patches:
  - target:
      kind: Cluster
      name: postgres
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
  - target:
      kind: ObjectStore
      name: r2
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://homelab-pg-staging/

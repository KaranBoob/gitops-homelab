# Holds Loki chunks. Postgres backups go to R2 (main) / this MinIO (local-test).
fullnameOverride: minio
mode: standalone
replicas: 1
existingSecret: minio-root
persistence:
  enabled: true
  storageClass: hostpath
  size: 20Gi
securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
service:
  type: ClusterIP
buckets:
  - name: loki-chunks
    policy: none
    purge: false
  - name: loki-ruler
    policy: none
    purge: false
  - name: loki-admin
    policy: none
    purge: false
  # local-test only: Postgres backup target (main uses R2 for this).
  - name: postgres-backup
    policy: none
    purge: false
# Replaces the chart default, which creates console/console123 as admin.
users:
  - accessKey: loki
    existingSecret: minio-loki
    existingSecretKey: secretKey
    policy: readwrite
  - accessKey: postgres-backup
    existingSecret: minio-postgres-backup
    existingSecretKey: secretKey
    policy: readwrite
metrics:
  serviceMonitor:
    enabled: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi

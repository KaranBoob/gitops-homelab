apiVersion: v1
kind: ResourceQuota
metadata:
  name: env
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    persistentvolumeclaims: "6"
---
# Quota needs requests on every container. This fills them in when missing.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi

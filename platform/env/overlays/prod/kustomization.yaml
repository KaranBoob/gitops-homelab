apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: prod
patches:
  - target:
      kind: Namespace
      name: env
    patch: |-
      - op: replace
        path: /metadata/name
        value: prod
  - target:
      kind: ResourceQuota
      name: env
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "4"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi

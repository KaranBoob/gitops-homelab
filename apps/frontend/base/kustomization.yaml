apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - httproute.yaml
# subPath mounts never see ConfigMap updates. A hashed name rolls the pods.
configMapGenerator:
  - name: frontend-html
    files:
      - index.html

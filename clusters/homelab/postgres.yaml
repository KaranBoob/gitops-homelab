apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: postgres
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            auto: "true"
          - env: staging
            auto: "true"
          - env: prod
            auto: "false"
  template:
    metadata:
      name: "postgres-{{.env}}"
    spec:
      project: "{{.env}}"
      source:
        repoURL: https://github.com/KaranBoob/gitops-homelab.git
        targetRevision: local-test
        path: "infrastructure/cloudnative-pg/cluster/overlays/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.env}}"
      syncPolicy:
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
  templatePatch: |
    {{- if eq .auto "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
